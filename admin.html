<!-- admin.html -->

<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Minik Yıldırım | Admin</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:Poppins,sans-serif;

background:#FFF9F5;

padding:40px;

color:#444;

}

.container{

max-width:1100px;

margin:auto;

}

h1{

margin-bottom:30px;

}

.cards{

display:grid;

grid-template-columns:repeat(3,1fr);

gap:20px;

margin-bottom:35px;

}

.card{

background:white;

padding:30px;

border-radius:22px;

box-shadow:0 10px 30px rgba(0,0,0,.08);

text-align:center;

}

.number{

font-size:42px;

font-weight:bold;

margin-top:10px;

}

table{

width:100%;

border-collapse:collapse;

background:white;

border-radius:20px;

overflow:hidden;

box-shadow:0 10px 30px rgba(0,0,0,.08);

}

th{

background:#F6F6F6;

padding:18px;

text-align:left;

}

td{

padding:18px;

border-top:1px solid #eee;

vertical-align:top;

}

.message{

max-width:500px;

line-height:1.6;

}

@media(max-width:850px){

.cards{

grid-template-columns:1fr;

}

table{

display:block;

overflow:auto;

}

}

</style>

</head>

<body>

<div class="container">

<h1>☁️ Minik Yıldırım Admin ⚡</h1>

<div class="cards">

<div class="card">

<div>Toplam Mesaj</div>

<div
id="messageCount"
class="number">

0

</div>

</div>

<div class="card">

<div>🩷 Kız Tahmini</div>

<div
id="girlCount"
class="number">

0

</div>

</div>

<div class="card">

<div>💙 Erkek Tahmini</div>

<div
id="boyCount"
class="number">

0

</div>

</div>

</div>


<table>

<thead>

<tr>

<th>İsim</th>

<th>Tahmin</th>

<th>Mesaj</th>

</tr>

</thead>

<tbody id="table">

</tbody>

</table>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getFirestore,

collection,

getDocs,

query,

orderBy

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={

apiKey:"YOUR_API_KEY",

authDomain:"YOUR_PROJECT.firebaseapp.com",

projectId:"YOUR_PROJECT_ID",

storageBucket:"YOUR_PROJECT.firebasestorage.app",

messagingSenderId:"XXXXXXXX",

appId:"XXXXXXXX"

};

const app=initializeApp(firebaseConfig);

const db=getFirestore(app);

load();


async function load(){

let girl=0;
let boy=0;

const predictions=await getDocs(

collection(db,"predictions")

);

predictions.forEach(doc=>{

if(doc.data().prediction==="girl"){

girl++;

}
else{

boy++;

}

});

document.getElementById("girlCount").innerHTML=girl;

document.getElementById("boyCount").innerHTML=boy;



const q=query(

collection(db,"messages"),

orderBy("createdAt","desc")

);

const snapshot=await getDocs(q);

document.getElementById("messageCount").innerHTML=snapshot.size;

snapshot.forEach(doc=>{

const d=doc.data();

const row=`

<tr>

<td>${d.name}</td>

<td>

${d.prediction=="girl"?"🩷 Kız":"💙 Erkek"}

</td>

<td class="message">

${d.message}

</td>

</tr>

`;

table.innerHTML+=row;

});

}

</script>

</body>

</html>
