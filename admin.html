<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Minik Yıldırım | Yönetim</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:'Poppins',sans-serif;

    background:#EFF0F2;

    color:#444;

    min-height:100vh;

    padding:40px 20px;

}

.container{

    max-width:1100px;

    margin:auto;

}

.header{

    text-align:center;

    margin-bottom:40px;

}

.header h1{

    font-size:32px;

    margin-bottom:8px;

}

.header p{

    color:#888;

}


/* ÖZET KARTLARI */

.summary{

    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:20px;

    margin-bottom:35px;

}

.summary-card{

    background:white;

    border-radius:22px;

    padding:25px;

    text-align:center;

    box-shadow:
    0 10px 30px
    rgba(0,0,0,.06);

}

.summary-label{

    color:#888;

    font-size:14px;

}

.summary-number{

    font-size:38px;

    font-weight:600;

    margin-top:8px;

}


/* TAHMİN DAĞILIMI */

.prediction-box{

    background:white;

    border-radius:22px;

    padding:30px;

    margin-bottom:35px;

    box-shadow:
    0 10px 30px
    rgba(0,0,0,.06);

}

.prediction-box h2{

    font-size:20px;

    margin-bottom:25px;

}

.predictions{

    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:20px;

}

.prediction{

    padding:20px;

    border-radius:16px;

    text-align:center;

}

.prediction.girl{

    background:#FFF0F5;

}

.prediction.boy{

    background:#EEF7FF;

}

.prediction .emoji{

    font-size:30px;

}

.prediction .count{

    font-size:30px;

    font-weight:600;

    margin-top:5px;

}


/* MESAJLAR */

.messages{

    background:white;

    border-radius:22px;

    padding:30px;

    box-shadow:
    0 10px 30px
    rgba(0,0,0,.06);

}

.messages-header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:25px;

}

.messages-header h2{

    font-size:20px;

}

.refresh{

    border:none;

    background:#F1F1F1;

    padding:10px 16px;

    border-radius:12px;

    cursor:pointer;

    font-family:inherit;

}

.refresh:hover{

    background:#E7E7E7;

}


/* TABLO */

.table-wrapper{

    overflow-x:auto;

}

table{

    width:100%;

    border-collapse:collapse;

}

thead{

    background:#F7F7F7;

}

th{

    text-align:left;

    padding:15px;

    font-size:13px;

    color:#777;

    white-space:nowrap;

}

td{

    padding:17px 15px;

    border-top:1px solid #eee;

    vertical-align:top;

    font-size:14px;

}

td.name{

    font-weight:600;

    white-space:nowrap;

}

td.message{

    line-height:1.6;

    min-width:300px;

}

.prediction-tag{

    display:inline-block;

    padding:6px 10px;

    border-radius:20px;

    font-size:12px;

    white-space:nowrap;

}

.prediction-tag.girl{

    background:#FFF0F5;

    color:#D46A91;

}

.prediction-tag.boy{

    background:#EEF7FF;

    color:#4D9AD8;

}

.empty{

    text-align:center;

    padding:40px;

    color:#999;

}


/* MOBİL */

@media(max-width:700px){

    body{

        padding:25px 12px;

    }

    .summary{

        grid-template-columns:1fr;

    }

    .predictions{

        grid-template-columns:1fr;

    }

    .messages{

        padding:20px;

    }

    .header h1{

        font-size:26px;

    }

}

</style>

</head>


<body>

<div class="container">


<!-- BAŞLIK -->

<div class="header">

    <h1>☁️ Minik Yıldırım ⚡</h1>

    <p>
        Tahminler ve bebeğimize bırakılan güzel mesajlar
    </p>

</div>


<!-- ÖZET -->

<div class="summary">

    <div class="summary-card">

        <div class="summary-label">
            Toplam Tahmin
        </div>

        <div
            id="totalPredictions"
            class="summary-number">

            0

        </div>

    </div>


    <div class="summary-card">

        <div class="summary-label">
            Toplam Mesaj
        </div>

        <div
            id="totalMessages"
            class="summary-number">

            0

        </div>

    </div>


    <div class="summary-card">

        <div class="summary-label">
            Katılım
        </div>

        <div
            id="uniqueParticipants"
            class="summary-number">

            0

        </div>

    </div>

</div>


<!-- TAHMİNLER -->

<div class="prediction-box">

    <h2>Tahmin Dağılımı</h2>

    <div class="predictions">


        <div class="prediction girl">

            <div class="emoji">
                🩷
            </div>

            <div
                id="girlCount"
                class="count">

                0

            </div>

            <div>
                Kız
            </div>

        </div>


        <div class="prediction boy">

            <div class="emoji">
                💙
            </div>

            <div
                id="boyCount"
                class="count">

                0

            </div>

            <div>
                Erkek
            </div>

        </div>

    </div>

</div>


<!-- MESAJLAR -->

<div class="messages">

    <div class="messages-header">

        <h2>💌 Bebeğimize Bırakılan Mesajlar</h2>

        <button
            class="refresh"
            onclick="loadDashboard()">

            🔄 Yenile

        </button>

    </div>


    <div class="table-wrapper">

        <table>

            <thead>

                <tr>

                    <th>
                        İsim
                    </th>

                    <th>
                        Tahmin
                    </th>

                    <th>
                        Mesaj
                    </th>

                    <th>
                        Tarih
                    </th>

                </tr>

            </thead>

            <tbody id="messageTable">

                <tr>

                    <td
                        colspan="4"
                        class="empty">

                        Mesajlar yükleniyor...

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>


</div>


<script type="module">

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {

    getFirestore,

    collection,

    getDocs,

    query,

    orderBy

}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

    apiKey:
    "AIzaSyBnr7ItRJZoCApnimGhKkOySWK6BQNfXNc",

    authDomain:
    "baby-yildirim.firebaseapp.com",

    projectId:
    "baby-yildirim",

    storageBucket:
    "baby-yildirim.firebasestorage.app",

    messagingSenderId:
    "1046244114876",

    appId:
    "1:1046244114876:web:319ec1995b5686b251ebb9"

};


const app =
    initializeApp(firebaseConfig);


const db =
    getFirestore(app);


/* DASHBOARD */

async function loadDashboard(){

    try{

        /*
         * TAHMİNLER
         */

        const predictionSnapshot =
            await getDocs(
                collection(
                    db,
                    "predictions"
                )
            );


        let girl = 0;

        let boy = 0;


        predictionSnapshot.forEach(
            (doc) => {

                const data =
                    doc.data();


                if(
                    data.prediction === "girl"
                ){

                    girl++;

                }

                if(
                    data.prediction === "boy"
                ){

                    boy++;

                }

            }
        );


        const total =
            girl + boy;


        document.getElementById(
            "girlCount"
        ).textContent = girl;


        document.getElementById(
            "boyCount"
        ).textContent = boy;


        document.getElementById(
            "totalPredictions"
        ).textContent = total;


        /*
         * MESAJLAR
         */

        const messageQuery =
            query(

                collection(
                    db,
                    "messages"
                ),

                orderBy(
                    "createdAt",
                    "desc"
                )

            );


        const messageSnapshot =
            await getDocs(
                messageQuery
            );


        document.getElementById(
            "totalMessages"
        ).textContent =
            messageSnapshot.size;


        /*
         * MESAJ TABLOSU
         */

        const table =
            document.getElementById(
                "messageTable"
            );


        table.innerHTML = "";


        if(
            messageSnapshot.empty
        ){

            table.innerHTML = `

                <tr>

                    <td
                        colspan="4"
                        class="empty">

                        Henüz mesaj bırakılmamış. ❤️

                    </td>

                </tr>

            `;

            return;

        }


        messageSnapshot.forEach(
            (doc) => {

                const data =
                    doc.data();


                let predictionText =
                    "—";

                let predictionClass =
                    "";


                if(
                    data.prediction === "girl"
                ){

                    predictionText =
                        "🩷 Kız";

                    predictionClass =
                        "girl";

                }


                if(
                    data.prediction === "boy"
                ){

                    predictionText =
                        "💙 Erkek";

                    predictionClass =
                        "boy";

                }


                let dateText =
                    "—";


                if(
                    data.createdAt
                ){

                    const date =
                        data.createdAt
                        .toDate();


                    dateText =
                        date.toLocaleDateString(
                            "tr-TR",
                            {
                                day:"2-digit",
                                month:"2-digit",
                                year:"numeric"
                            }
                        )
                        +
                        " "
                        +
                        date.toLocaleTimeString(
                            "tr-TR",
                            {
                                hour:"2-digit",
                                minute:"2-digit"
                            }
                        );

                }


                const row =
                    document.createElement(
                        "tr"
                    );


                row.innerHTML = `

                    <td class="name">

                        ${escapeHtml(
                            data.name || ""
                        )}

                    </td>


                    <td>

                        <span
                            class="prediction-tag ${predictionClass}">

                            ${predictionText}

                        </span>

                    </td>


                    <td class="message">

                        ${escapeHtml(
                            data.message || ""
                        )}

                    </td>


                    <td>

                        ${dateText}

                    </td>

                `;


                table.appendChild(row);

            }
        );


        /*
         * KATILIM
         *
         * Aynı kişinin hem tahmin
         * hem mesaj bırakması durumunda
         * iki kez saymamak için isimleri
         * topluyoruz.
         */

        const names =
            new Set();


        messageSnapshot.forEach(
            (doc) => {

                const name =
                    doc.data().name;

                if(name){

                    names.add(
                        name.trim()
                    );

                }

            }
        );


        document.getElementById(
            "uniqueParticipants"
        ).textContent =
            names.size;


    }
    catch(error){

        console.error(
            "Dashboard yüklenemedi:",
            error
        );


        document.getElementById(
            "messageTable"
        ).innerHTML = `

            <tr>

                <td
                    colspan="4"
                    class="empty">

                    Veriler yüklenirken
                    bir hata oluştu.

                </td>

            </tr>

        `;

    }

}


/*
 * HTML güvenliği
 */

function escapeHtml(value){

    return String(value)

        .replaceAll("&","&amp;")

        .replaceAll("<","&lt;")

        .replaceAll(">","&gt;")

        .replaceAll('"',"&quot;")

        .replaceAll("'","&#039;");

}


window.loadDashboard =
    loadDashboard;


loadDashboard();

</script>

</body>

</html>
